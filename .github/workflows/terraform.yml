name: terraform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to change"
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: "apply or destroy"
        type: choice
        options: [apply, destroy]
        required: true

permissions:
  id-token: write       # needed to request the OIDC token
  contents: read
  pull-requests: write  # needed to comment the plan on the PR

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.17.1
  TF_IN_AUTOMATION: "true"
  TF_VAR_ssh_cidr: ${{ vars.SSH_CIDR }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}

jobs:
  checks:
    name: fmt, validate, tflint, checkov
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          for dir in envs/dev envs/prod bootstrap; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: tflint --recursive --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          quiet: true

  plan:
    name: plan (${{ matrix.env }})
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::293033346095:role/github-actions-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/${{ matrix.env }}/plan.txt', 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(no summary)'])[0];
            const body = `### Terraform plan: \`${{ matrix.env }}\`\n**${summary}**\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # waits for approval when the environment requires reviewers
    concurrency: terraform-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::293033346095:role/github-actions-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform ${{ inputs.action }}
        working-directory: envs/${{ inputs.environment }}
        run: |
          terraform init -input=false
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform destroy -input=false -auto-approve
          else
            terraform apply -input=false -auto-approve
          fi
